kind = "web"
previewPath = "/"
title = "Alpha Chat Web"
version = "1.0.0"
id = "artifacts/alpha-chat-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19025

[services.development]
run = "pnpm --filter @workspace/alpha-chat-web run dev"

[services.production]
deploymentTarget = "autoscale"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/alpha-chat-web", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# server.mjs: Node.js built-in only, no deps. Sets COOP/COEP headers for
# SharedArrayBuffer / Breez SDK WASM. SPA fallback → index.html.
args = ["node", "artifacts/alpha-chat-web/server.mjs"]

[services.production.run.env]
PORT = "19025"
NODE_ENV = "production"

[services.env]
PORT = "19025"
BASE_PATH = "/"
